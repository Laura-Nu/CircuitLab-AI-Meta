name: ${CIRCUITLAB_PROJECT_NAME:-circuitlab-meta}
x-backend: &backend
  image: ${CIRCUITLAB_IMAGE:-circuitlab-meta-backend:0.1.0}
  build:
    context: ..
    dockerfile: infra/docker/backend.Dockerfile
    args:
      CIRCUITLAB_BUILD_REVISION: ${CIRCUITLAB_BUILD_REVISION:-unknown}
  env_file: ../.env
  volumes:
    - evidence:/data/evidence
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: '3'
services:
  postgres:
    image: postgres:17.4-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
    volumes:
      - postgres:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    <<: *backend
    restart: 'no'
    command: [alembic, upgrade, head]
    depends_on:
      postgres:
        condition: service_healthy
  api:
    <<: *backend
    ports:
      - '127.0.0.1:${API_BIND_PORT:-8000}:8000'
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready')"]
      interval: 15s
      timeout: 5s
      retries: 3
  worker:
    <<: *backend
    command: [python, -m, app.worker]
    healthcheck:
      test: [CMD, python, -m, app.operations]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  postgres:
  evidence:
