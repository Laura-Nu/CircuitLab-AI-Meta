name: circuitlab_client
description: Evidence-based electronic circuit diagnosis assistant.
publish_to: none
version: 0.1.6+7
environment:
  sdk: ^3.9.2
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: 2.5.3
  web: 1.1.1
  flutter_riverpod: 2.6.1
  go_router: 14.8.1
  dio: 5.8.0+1
  url_launcher: 6.3.2
  image_picker: 1.1.2
  flutter_secure_storage: 9.2.4
  drift: 2.26.1
  sqlite3_flutter_libs: 0.5.32
  path_provider: 2.1.5
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 5.0.0
flutter:
  uses-material-design: true
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
