name: quality
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.4-bookworm
        env:
          POSTGRES_USER: circuitlab
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: circuitlab_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U circuitlab -d circuitlab_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.9.5'
          python-version: '3.12.10'
      - run: uv sync --frozen
        working-directory: services/backend
      - run: uv run ruff check .
        working-directory: services/backend
      - run: uv run --project services/backend ruff check experiments scripts/evaluate.py scripts/prepare_vps.py scripts/deploy_vps.py scripts/backup_vps.py scripts/release_bundle.py scripts/deploy_gateway.py scripts/ci_ship.py
      - run: uv run alembic upgrade head
        working-directory: services/backend
        env:
          DATABASE_URL: postgresql+psycopg://circuitlab:ci-only-password@localhost:5432/circuitlab_test
      - name: Verify the production inspector accepts the migrated schema
        working-directory: services/backend
        env:
          DATABASE_URL: postgresql+psycopg://circuitlab:ci-only-password@localhost:5432/circuitlab_test
        run: |
          uv run python - <<'PY'
          from app.db import SessionLocal
          from app.production_check import migration_current
          with SessionLocal() as db:
              assert migration_current(db), "Production inspector rejected the migrated schema"
          print("Production migration inspection passed")
          PY
      - run: uv run pytest -q
        working-directory: services/backend
      - run: uv run pytest -q
        working-directory: services/backend
        env:
          TEST_DATABASE_URL: postgresql+psycopg://circuitlab:ci-only-password@localhost:5432/circuitlab_test
      - run: uv sync --frozen && uv run pytest -q
        working-directory: services/bridge
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.35.6'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
        working-directory: apps/client
      - name: Analyze Flutter
        run: flutter analyze
        working-directory: apps/client
      - name: Test Flutter
        run: flutter test --reporter expanded
        working-directory: apps/client
      - name: Build Flutter web
        run: flutter build web --release --base-href /app/ --no-web-resources-cdn --dart-define=API_BASE_URL=/api/v1
        working-directory: apps/client
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python scripts/verify_web_navigation.py
      - run: python scripts/build_site.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/landing/package-lock.json
      - run: node --test apps/client/test/usb_serial_protocol.test.cjs
      - run: npm ci --ignore-scripts --no-audit --no-fund && npm test
        working-directory: apps/landing

      - name: Package the checked public website
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          APPROVED_REVISION: ${{ github.sha }}
        run: python scripts/release_bundle.py --revision "$APPROVED_REVISION"
      - name: Save the checked deployment artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: circuitlab-public-${{ github.sha }}
          path: |
            .tools/ci/site.tar.gz
            .tools/ci/site.tar.gz.sha256
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install platformio==6.1.19
      - run: python -m platformio run --project-dir firmware/instrument_node
        env:
          PLATFORMIO_CORE_DIR: ${{ github.workspace }}/.tools/platformio-core

  deploy:
    name: Deploy checked main to CircuitLab VPS
    needs: [backend, flutter, firmware]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CIRCUITLAB_AUTO_DEPLOY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://circuitlab.doc-ia.cloud/
    concurrency:
      group: circuitlab-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: circuitlab-public-${{ github.sha }}
          path: .tools/ci
      - name: Deploy the exact checked commit using the restricted project key
        env:
          APPROVED_REVISION: ${{ github.sha }}
          CIRCUITLAB_SSH_HOST: ${{ secrets.CIRCUITLAB_SSH_HOST }}
          CIRCUITLAB_SSH_USER: ${{ secrets.CIRCUITLAB_SSH_USER }}
          CIRCUITLAB_SSH_PORT: ${{ secrets.CIRCUITLAB_SSH_PORT || '22' }}
          CIRCUITLAB_SSH_KEY: ${{ secrets.CIRCUITLAB_SSH_KEY }}
          CIRCUITLAB_SSH_KNOWN_HOSTS: ${{ secrets.CIRCUITLAB_SSH_KNOWN_HOSTS }}
        run: python scripts/ci_ship.py --revision "$APPROVED_REVISION"
