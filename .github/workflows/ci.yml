name: quality
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.4-bookworm
        env:
          POSTGRES_USER: circuitlab
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: circuitlab_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U circuitlab -d circuitlab_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.5'
          python-version: '3.12.10'
      - run: uv sync --frozen
        working-directory: services/backend
      - run: uv run ruff check .
        working-directory: services/backend
      - run: uv run --project services/backend ruff check experiments scripts/evaluate.py scripts/prepare_vps.py scripts/deploy_vps.py
      - run: uv run alembic upgrade head
        working-directory: services/backend
        env:
          DATABASE_URL: postgresql+psycopg://circuitlab:ci-only-password@localhost:5432/circuitlab_test
      - run: uv run pytest -q
        working-directory: services/backend
      - run: uv run pytest -q
        working-directory: services/backend
        env:
          TEST_DATABASE_URL: postgresql+psycopg://circuitlab:ci-only-password@localhost:5432/circuitlab_test
      - run: uv sync --frozen && uv run pytest -q
        working-directory: services/bridge
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.6'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
        working-directory: apps/client
      - run: flutter analyze && flutter test && flutter build web --base-href /app/ --dart-define=API_BASE_URL=/api/v1
        working-directory: apps/client
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/build_site.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/landing/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund && npm test
        working-directory: apps/landing
